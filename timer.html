<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업용 스마트 타이머 위젯</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;600;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        /* 테마별 변수 설정 */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --timer-font: 'Orbitron', 'Noto Sans KR', sans-serif;
            --ui-font: 'Noto Sans KR', sans-serif;
        }

        /* 칠판 테마 */
        [data-theme="chalkboard"] {
            --bg-gradient: linear-gradient(135deg, #142e20 0%, #1e4630 100%);
            --card-bg: rgba(18, 48, 32, 0.9);
            --card-border: rgba(240, 235, 210, 0.2);
            --text-main: #fef08a;
            --text-sub: #cbd5e1;
            --accent-primary: #eab308;
            --accent-hover: #ca8a04;
            --ui-font: 'Gowun Dodum', sans-serif;
        }

        /* 모던 라이트 테마 */
        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --ui-font: 'Noto Sans KR', sans-serif;
        }

        /* 파스텔 교실 테마 */
        [data-theme="pastel"] {
            --bg-gradient: linear-gradient(135deg, #fef3c7 0%, #e0f2fe 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(251, 191, 36, 0.3);
            --text-main: #1e293b;
            --text-sub: #475569;
            --accent-primary: #f59e0b;
            --accent-hover: #d97706;
            --ui-font: 'Jua', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--ui-font);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .font-timer {
            font-family: var(--timer-font);
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
        }

        /* Ring progress transitions */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s ease-out, stroke 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }

        .pulse-subtle {
            animation: pulse-ring 1.5s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }

        @keyframes sand-flow {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -14; }
        }

        .sand-drip {
            stroke-dasharray: 3 3;
            animation: sand-flow 0.4s linear infinite;
        }

        @keyframes hourglass-flip {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(180deg); }
        }

        .rotate-flip {
            animation: hourglass-flip 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-blue-500 selection:text-white" data-theme="dark">

    <!-- Navigation / Header -->
    <header class="w-full max-w-6xl mx-auto p-4 flex flex-wrap items-center justify-between gap-4 z-10">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid font-bold fa-stopwatch"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight leading-none flex items-center gap-2">
                    수업용 스마트 타이머
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">Classroom Edition</span>
                </h1>
                <p class="text-xs opacity-75 mt-1" id="sub-header-text">알맞은 타이머 모드와 백그라운드 사운드를 설정해보세요.</p>
            </div>
        </div>

        <!-- Mode Selectors -->
        <div class="flex items-center gap-1 glass-card p-1.5 rounded-2xl shadow-sm text-sm font-medium">
            <button onclick="setMode('countdown')" id="tab-countdown" class="px-3.5 py-2 rounded-xl transition flex items-center gap-2 bg-blue-600 text-white shadow">
                <i class="fa-solid fa-hourglass-half"></i> <span class="hidden sm:inline">카운트다운</span>
            </button>
            <button onclick="setMode('stopwatch')" id="tab-stopwatch" class="px-3.5 py-2 rounded-xl transition flex items-center gap-2 opacity-70 hover:opacity-100">
                <i class="fa-solid fa-stopwatch"></i> <span class="hidden sm:inline">스톱워치</span>
            </button>
            <button onclick="setMode('pomodoro')" id="tab-pomodoro" class="px-3.5 py-2 rounded-xl transition flex items-center gap-2 opacity-70 hover:opacity-100">
                <i class="fa-solid fa-apple-whole"></i> <span class="hidden sm:inline">포모도로 세션</span>
            </button>
            <button onclick="setMode('turn')" id="tab-turn" class="px-3.5 py-2 rounded-xl transition flex items-center gap-2 opacity-70 hover:opacity-100">
                <i class="fa-solid fa-users"></i> <span class="hidden sm:inline">모둠 발표</span>
            </button>
        </div>

        <!-- Top Right Quick Controls -->
        <div class="flex items-center gap-2">
            <!-- Random Picker Button -->
            <button onclick="openPickerModal()" class="glass-card px-3 py-2 rounded-xl hover:bg-white/10 transition flex items-center gap-2 text-sm font-semibold" title="학생/모둠 무작위 뽑기">
                <i class="fa-solid fa-dice text-amber-400"></i>
                <span class="hidden md:inline">발표자 뽑기</span>
            </button>
            <!-- Sound Settings Toggle -->
            <button onclick="toggleModal('sound-modal')" class="glass-card w-10 h-10 rounded-xl hover:bg-white/10 transition flex items-center justify-center text-sm" title="알림음 및 백그라운드 소음 설정">
                <i class="fa-solid fa-volume-high text-blue-400"></i>
            </button>
            <!-- Theme Toggle -->
            <button onclick="toggleModal('theme-modal')" class="glass-card w-10 h-10 rounded-xl hover:bg-white/10 transition flex items-center justify-center text-sm" title="테마 변경">
                <i class="fa-solid fa-palette text-purple-400"></i>
            </button>
            <!-- Fullscreen Toggle -->
            <button onclick="toggleFullScreen()" class="glass-card w-10 h-10 rounded-xl hover:bg-white/10 transition flex items-center justify-center text-sm" title="전체화면">
                <i class="fa-solid fa-expand text-emerald-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col justify-center items-center relative z-10">
        
        <!-- Activity Title Input -->
        <div class="w-full max-w-lg mb-4 text-center">
            <div class="relative inline-block w-full">
                <input type="text" id="task-title-input" placeholder="✨ 활동명을 입력하세요 (예: 수학 36쪽 풀기, 2모둠 발표)" 
                    class="w-full text-center text-lg sm:text-xl font-bold bg-transparent border-b-2 border-current/20 focus:border-blue-500 outline-none px-4 py-1 transition placeholder:opacity-40"
                    oninput="saveTaskTitle()">
            </div>
        </div>

        <!-- Central Timer Card -->
        <div id="main-timer-card" class="glass-card w-full max-w-2xl rounded-3xl p-6 sm:p-10 shadow-2xl flex flex-col items-center justify-center relative overflow-hidden transition-all duration-300">
            
            <!-- Turn / Pomodoro Status Indicator (Shown only in Pomodoro / Turn mode) -->
            <div id="session-badge" class="hidden mb-4 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-500/30 animate-pulse">
                수업 세션 (25분)
            </div>

            <!-- Big Circular Timer Display -->
            <div class="relative w-72 h-72 sm:w-96 sm:h-96 flex items-center justify-center my-2">
                <!-- SVG Circle Progress -->
                <svg class="w-full h-full" viewBox="0 0 220 220">
                    <!-- Background Track Circle -->
                    <circle cx="110" cy="110" r="92" fill="none" stroke="currentColor" class="opacity-10" stroke-width="12" />
                    <!-- Animated Progress Ring -->
                    <circle id="progress-ring" cx="110" cy="110" r="92" fill="none" stroke="#3b82f6" 
                        stroke-width="12" stroke-linecap="round" class="progress-ring-circle" stroke-dasharray="578.05" stroke-dashoffset="0" />
                </svg>

                <!-- Digital Time & Hourglass Display inside Circle -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-2">
                    
                    <!-- Dynamic SVG Hourglass (Enlarged Size) -->
                    <div id="hourglass-container" class="mb-2 transition-transform duration-500 transform hover:scale-105">
                        <svg class="w-20 h-24 sm:w-28 sm:h-32 drop-shadow-xl" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Outer Frame Top/Bottom Bars -->
                            <rect x="18" y="6" width="64" height="6" rx="3" fill="currentColor" opacity="0.8" />
                            <rect x="18" y="108" width="64" height="6" rx="3" fill="currentColor" opacity="0.8" />
                            
                            <!-- Hourglass Glass Body -->
                            <path d="M25 12 C25 45 45 54 48 60 C45 66 25 75 25 108 H75 C75 75 55 66 52 60 C55 54 75 45 75 12 Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round" fill="rgba(255, 255, 255, 0.08)" />
                            
                            <!-- Top Sand -->
                            <g clip-path="url(#top-bulb-clip)">
                                <rect id="top-sand" x="15" y="12" width="70" height="48" fill="#f59e0b" />
                            </g>
                            
                            <!-- Bottom Sand -->
                            <g clip-path="url(#bottom-bulb-clip)">
                                <rect id="bottom-sand" x="15" y="108" width="70" height="0" fill="#f59e0b" />
                            </g>

                            <!-- Animated Falling Sand Stream -->
                            <line id="sand-stream" x1="50" y1="58" x2="50" y2="108" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" class="hidden sand-drip" />

                            <!-- Glass Glare Lines -->
                            <path d="M30 20 Q32 35 42 48" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3" />
                            <path d="M70 72 Q68 88 58 100" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.2" />

                            <!-- Clips for top and bottom bulbs -->
                            <defs>
                                <clipPath id="top-bulb-clip">
                                    <path d="M25 12 C25 45 45 54 48 60 L 52 60 C55 54 75 45 75 12 Z" />
                                </clipPath>
                                <clipPath id="bottom-bulb-clip">
                                    <path d="M48 60 C45 66 25 75 25 108 L 75 108 C75 75 55 66 52 60 Z" />
                                </clipPath>
                            </defs>
                        </svg>
                    </div>

                    <div id="timer-display" class="font-timer text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight leading-none drop-shadow-md">
                        05:00
                    </div>
                    <!-- Milliseconds / Sub text for stopwatch -->
                    <div id="sub-display" class="font-timer text-sm sm:text-base font-semibold opacity-70 mt-1">
                        00.00
                    </div>
                </div>
            </div>

            <!-- Countdown Control Panel (Shown in Countdown Mode) -->
            <div id="countdown-controls" class="w-full flex flex-col items-center gap-5 mt-4">
                
                <!-- Quick Time Adjust Buttons (+ / -) -->
                <div class="flex flex-wrap justify-center gap-2 text-sm font-semibold">
                    <button onclick="addTime(-300)" class="px-3 py-1.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 transition active:scale-95">
                        -5분
                    </button>
                    <button onclick="addTime(-60)" class="px-3 py-1.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 transition active:scale-95">
                        -1분
                    </button>
                    <button onclick="addTime(-10)" class="px-3 py-1.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 transition active:scale-95">
                        -10초
                    </button>
                    <button onclick="addTime(10)" class="px-3 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 transition active:scale-95">
                        +10초
                    </button>
                    <button onclick="addTime(60)" class="px-3 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 transition active:scale-95">
                        +1분
                    </button>
                    <button onclick="addTime(300)" class="px-3 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 transition active:scale-95">
                        +5분
                    </button>
                </div>

                <!-- Time Presets Grid -->
                <div class="flex flex-wrap justify-center gap-2">
                    <button onclick="setPreset(1)" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold hover:border-blue-500/50 transition">1분</button>
                    <button onclick="setPreset(3)" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold hover:border-blue-500/50 transition">3분</button>
                    <button onclick="setPreset(5)" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold hover:border-blue-500/50 transition">5분</button>
                    <button onclick="setPreset(10)" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold hover:border-blue-500/50 transition">10분</button>
                    <button onclick="setPreset(15)" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold hover:border-blue-500/50 transition">15분</button>
                    <button onclick="setPreset(20)" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold hover:border-blue-500/50 transition">20분</button>
                    <button onclick="setPreset(30)" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold hover:border-blue-500/50 transition">30분</button>
                    <button onclick="openCustomTimeModal()" class="px-3 py-1.5 rounded-xl glass-card text-xs font-bold text-blue-400 hover:border-blue-500 transition">
                        <i class="fa-solid fa-pen-to-square mr-1"></i>직접 입력
                    </button>
                </div>
            </div>

            <!-- Primary Action Buttons (Start / Pause / Reset) -->
            <div class="flex items-center gap-4 mt-8">
                <!-- Reset Button -->
                <button onclick="resetTimer()" class="w-14 h-14 rounded-2xl glass-card flex items-center justify-center text-xl hover:bg-white/20 active:scale-95 transition" title="초기화">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>

                <!-- Play / Pause Main Button -->
                <button id="btn-toggle" onclick="toggleTimer()" class="px-10 py-4 rounded-2xl bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-extrabold text-2xl shadow-xl shadow-blue-600/40 transition flex items-center gap-3">
                    <i id="btn-toggle-icon" class="fa-solid fa-play"></i>
                    <span id="btn-toggle-text">시작</span>
                </button>

                <!-- Lap / Finish Button -->
                <button id="btn-secondary" onclick="handleSecondaryAction()" class="w-14 h-14 rounded-2xl glass-card flex items-center justify-center text-xl hover:bg-white/20 active:scale-95 transition" title="랩 타임 / 종료">
                    <i id="btn-secondary-icon" class="fa-solid fa-flag"></i>
                </button>
            </div>

        </div>

        <!-- Stopwatch Lap List Container -->
        <div id="stopwatch-lap-section" class="w-full max-w-2xl mt-6 glass-card rounded-2xl p-4 hidden">
            <h3 class="text-sm font-bold opacity-80 mb-2 flex items-center justify-between">
                <span><i class="fa-solid fa-list-ol mr-2 text-blue-400"></i>스톱워치 랩 타임 (기록)</span>
                <button onclick="clearLaps()" class="text-xs text-red-400 hover:underline">기록 삭제</button>
            </h3>
            <div id="lap-list" class="max-h-40 overflow-y-auto space-y-1.5 text-sm pr-2">
                <div class="text-center py-4 text-xs opacity-50">기록된 랩 타임이 없습니다.</div>
            </div>
        </div>

        <!-- Turn/Group Mode Control Bar -->
        <div id="turn-control-section" class="w-full max-w-2xl mt-6 glass-card rounded-2xl p-4 hidden flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <span class="text-sm font-bold whitespace-nowrap">현재 발표:</span>
                <select id="turn-select" onchange="changeTurnGroup()" class="bg-black/20 border border-current/20 rounded-xl px-3 py-1.5 text-sm font-semibold outline-none focus:border-blue-500 w-full">
                    <option value="1">1모둠 (발표 1번)</option>
                    <option value="2">2모둠 (발표 2번)</option>
                    <option value="3">3모둠 (발표 3번)</option>
                    <option value="4">4모둠 (발표 4번)</option>
                    <option value="5">5모둠 (발표 5번)</option>
                    <option value="6">6모둠 (발표 6번)</option>
                </select>
            </div>
            <button onclick="nextTurnGroup()" class="w-full sm:w-auto px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition flex items-center justify-center gap-2">
                <span>다음 발표팀으로 이동</span>
                <i class="fa-solid fa-forward"></i>
            </button>
        </div>

    </main>

    <!-- Custom Time Modal -->
    <div id="custom-time-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border border-white/20">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-clock text-blue-400"></i> 시간 직접 설정
            </h3>
            <div class="flex items-center justify-center gap-3 my-6">
                <div class="flex flex-col items-center">
                    <label class="text-xs opacity-70 mb-1">분 (Minutes)</label>
                    <input type="number" id="custom-min" min="0" max="180" value="5" class="w-20 text-center text-3xl font-timer font-bold bg-black/30 border border-current/20 rounded-2xl py-2 outline-none focus:border-blue-500">
                </div>
                <span class="text-3xl font-bold mt-5">:</span>
                <div class="flex flex-col items-center">
                    <label class="text-xs opacity-70 mb-1">초 (Seconds)</label>
                    <input type="number" id="custom-sec" min="0" max="59" value="0" class="w-20 text-center text-3xl font-timer font-bold bg-black/30 border border-current/20 rounded-2xl py-2 outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="closeModal('custom-time-modal')" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/20 font-bold text-sm">취소</button>
                <button onclick="applyCustomTime()" class="flex-1 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-sm text-white">확인 적용</button>
            </div>
        </div>
    </div>

    <!-- Random Student/Team Picker Modal -->
    <div id="picker-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 shadow-2xl relative border border-white/20">
            <button onclick="closeModal('picker-modal')" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 text-sm">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-xl font-bold mb-2 flex items-center gap-2">
                <i class="fa-solid fa-dice text-amber-400"></i> 무작위 발표자 / 모둠 뽑기
            </h3>
            <p class="text-xs opacity-70 mb-4">학생 번호 범위 또는 이름/모둠 목록을 입력하여 무작위로 추첨합니다.</p>

            <!-- Mode switch for picker -->
            <div class="flex gap-2 p-1 bg-black/20 rounded-xl mb-4 text-xs font-bold">
                <button id="picker-tab-num" onclick="setPickerType('number')" class="flex-1 py-2 rounded-lg bg-blue-600 text-white">번호 추첨</button>
                <button id="picker-tab-list" onclick="setPickerType('list')" class="flex-1 py-2 rounded-lg hover:bg-white/10">이름/모둠 목록</button>
            </div>

            <!-- Number Picker Inputs -->
            <div id="picker-type-number" class="space-y-3 my-4">
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold">1번 부터</span>
                    <input type="number" id="picker-max-num" value="25" min="1" max="100" class="w-24 text-center font-bold bg-black/30 border border-current/20 rounded-xl py-1.5 outline-none focus:border-blue-500">
                    <span class="text-sm font-semibold">번 까지</span>
                </div>
            </div>

            <!-- List Picker Inputs -->
            <div id="picker-type-list" class="space-y-2 my-4 hidden">
                <textarea id="picker-list-input" placeholder="이름이나 모둠 이름을 쉼표(,) 또는 줄바꿈으로 입력하세요&#10;예: 1모둠, 2모둠, 3모둠, 4모둠" class="w-full h-24 p-3 bg-black/30 border border-current/20 rounded-xl text-sm outline-none focus:border-blue-500 resize-none"></textarea>

                    ?

    <!-- Sound Settings Modal -->
    <div id="sound-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">

            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">

            <!-- Timer Alarm Sound Select -->
            <div class="space-y-4">
                <div>

    <!-- Theme Modal -->
    <div id="theme-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl relative border border-white/20">

            <div class="grid grid-cols-2 gap-3 text-sm font-bold">

                </button>
                <button onclick="applyTheme('light')" class="p-4 rounded-2xl bg-slate-100 text-slate-900 border border-slate-300 flex flex-col items-center gap-2">
                    <span class="text-2xl">☀️</span> 모던 라이트
                </button>
                <button onclick="applyTheme('pastel')" class="p-4 rounded-2xl bg-amber-100 text-slate-800 border border-amber-300 flex flex-col items-center gap-2">
                    <span class="text-2xl">🎈</span> 파스텔 교실
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           Web Audio API Sound Synthesizer (No external audio dependencies!)
           ========================================================================== */
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        let selectedAlarm = 'school';
        let currentAmbient = 'none';
        let ambientNode = null;

        function setAlarmSound(type) {
            selectedAlarm = type;
            ['school', 'chime', 'gong', 'whistle'].forEach(s => {
                const btn = document.getElementById(`sound-btn-${s}`);
                if (s === type) {
                    btn.className = "p-3 rounded-xl border border-blue-500 bg-blue-500/20 text-xs font-bold text-left flex items-center justify-between";
                } else {
                    btn.className = "p-3 rounded-xl border border-white/10 bg-black/20 text-xs font-bold text-left flex items-center justify-between opacity-70";
                }
            });
            playSound(type);
        }

        function playSound(type) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            if (type === 'beep') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now); // A5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } 
            else if (type === 'school') {
                // Classic School Bell Chime (Ding-Dong-Dang-Dong)
                const notes = [523.25, 659.25, 783.99, 523.25]; // C5, E5, G5, C5
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const startTime = now + index * 0.4;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.4, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 1.2);
                });
            }
            else if (type === 'chime') {
                // Arpeggio chime
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const t = now + idx * 0.12;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0.3, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.8);
                });
            }
            else if (type === 'gong') {
                // Deep Gong / Singing bowl
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 2.5);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 3.0);
            }
            else if (type === 'whistle') {
                // Whistle sound
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2200, now);
                osc.frequency.linearRampToValueAtTime(2600, now + 0.1);
                osc.frequency.linearRampToValueAtTime(2200, now + 0.25);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Ambient Sound Synthesizer (Rain, Clock)
        function toggleAmbient(type) {
            currentAmbient = type;
            ['none', 'rain', 'clock'].forEach(id => {
                const btn = document.getElementById(`ambient-${id}`);
                if (id === type) {
                    btn.className = "p-2.5 rounded-xl border border-blue-500 bg-blue-500/20";
                } else {
                    btn.className = "p-2.5 rounded-xl border border-white/10 bg-black/20 opacity-70";
                }
            });

            if (ambientNode) {
                try { ambientNode.stop(); } catch(e){}
                ambientNode = null;
            }

            if (type === 'none') return;

            const ctx = getAudioContext();
            if (type === 'rain') {
                // Synthesize soft rain white noise
                const bufferSize = ctx.sampleRate * 2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const whiteNoise = ctx.createBufferSource();
                whiteNoise.buffer = buffer;
                whiteNoise.loop = true;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, ctx.currentTime);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.08, ctx.currentTime);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                whiteNoise.start();
                ambientNode = whiteNoise;
            }
        }

        /* ==========================================================================
           Timer Core State & Logic
           ========================================================================== */
        let timerMode = 'countdown'; // 'countdown', 'stopwatch', 'pomodoro', 'turn'
        let timerState = 'idle'; // 'idle', 'running', 'paused'
        let timerInterval = null;

        // Times represented in milliseconds
        let targetTimeMs = 5 * 60 * 1000; 
        let remainingTimeMs = 5 * 60 * 1000;
        let stopwatchElapsedMs = 0;
        let lastTimestamp = 0;

        // Pomodoro State
        let pomodoroPhase = 'work'; // 'work' or 'break'
        const POMODORO_WORK_MS = 25 * 60 * 1000;
        const POMODORO_BREAK_MS = 5 * 60 * 1000;

        // Turn State
        let currentTurnGroup = 1;

        // Stopwatch Lap
        let laps = [];

        const CIRCLE_RADIUS = 92;
        const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS; // ~578.05

        function toggleTimer() {
            getAudioContext();
            if (timerState === 'running') {
                pauseTimer();
            } else {
                timerState = 'running';
                lastTimestamp = performance.now();
                const icon = document.getElementById('btn-toggle-icon');
                const text = document.getElementById('btn-toggle-text');
                if (icon) icon.className = "fa-solid fa-pause";
                if (text) text.textContent = "일시정지";
                timerInterval = requestAnimationFrame(stepTimer);
            }
        }

        function updateDisplay() {
            const displayEl = document.getElementById('timer-display');
            const subDisplayEl = document.getElementById('sub-display');
            const ringEl = document.getElementById('progress-ring');
            const mainCard = document.getElementById('main-timer-card');

            let totalMsToShow = remainingTimeMs;
            let ratio = 1;

            if (timerMode === 'stopwatch') {
                totalMsToShow = stopwatchElapsedMs;
                subDisplayEl.classList.remove('hidden');
                
                const totalSec = Math.floor(stopwatchElapsedMs / 1000);
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                const ms = Math.floor((stopwatchElapsedMs % 1000) / 10);

                displayEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                subDisplayEl.textContent = `.${String(ms).padStart(2, '0')}`;
                
                // Continuous ring animation for stopwatch
                const cycle = (stopwatchElapsedMs % 10000) / 10000;
                ringEl.style.strokeDashoffset = (CIRCLE_CIRCUMFERENCE * (1 - cycle)).toString();
                
                // Update hourglass for stopwatch cycle
                const topSand = document.getElementById('top-sand');
                const bottomSand = document.getElementById('bottom-sand');
                const sandStream = document.getElementById('sand-stream');
                const swCycle = (stopwatchElapsedMs % 60000) / 60000;
                if (topSand && bottomSand) {
                    topSand.setAttribute('y', (12 + swCycle * 48).toString());
                    topSand.setAttribute('height', Math.max(0, (1 - swCycle) * 48).toString());
                    bottomSand.setAttribute('y', (108 - swCycle * 48).toString());
                    bottomSand.setAttribute('height', (swCycle * 48).toString());
                }
                if (sandStream) {
                    if (timerState === 'running') sandStream.classList.remove('hidden');
                    else sandStream.classList.add('hidden');
                }
                return;
            } else {
                subDisplayEl.classList.add('hidden');
            }

            if (totalMsToShow < 0) totalMsToShow = 0;

            const totalSec = Math.ceil(totalMsToShow / 1000);
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;

            displayEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            // Calculate progress ratio
            if (targetTimeMs > 0) {
                ratio = remainingTimeMs / targetTimeMs;
                if (ratio > 1) ratio = 1;
                if (ratio < 0) ratio = 0;
            }

            const dashOffset = CIRCLE_CIRCUMFERENCE * (1 - ratio);
            ringEl.style.strokeDashoffset = dashOffset.toString();

            const topSand = document.getElementById('top-sand');
            const bottomSand = document.getElementById('bottom-sand');
            const sandStream = document.getElementById('sand-stream');

            if (topSand && bottomSand) {
                const topY = 12 + (1 - ratio) * 48;
                const topH = Math.max(0, ratio * 48);
                const bottomY = 108 - (1 - ratio) * 48;
                const bottomH = (1 - ratio) * 48;

                topSand.setAttribute('y', topY.toString());
                topSand.setAttribute('height', topH.toString());
                bottomSand.setAttribute('y', bottomY.toString());
                bottomSand.setAttribute('height', bottomH.toString());
            }

            if (sandStream) {
                if (timerState === 'running' && remainingTimeMs > 0 && ratio > 0) {
                    sandStream.classList.remove('hidden');
                } else {
                    sandStream.classList.add('hidden');
                }
            }

            // Color status changes as time runs out
            if (timerMode === 'countdown' || timerMode === 'turn' || timerMode === 'pomodoro') {
                const currentColor = ratio <= 0.1 ? '#ef4444' : ratio <= 0.25 ? '#f59e0b' : '#3b82f6';
                if (topSand) topSand.setAttribute('fill', currentColor);
                if (bottomSand) bottomSand.setAttribute('fill', currentColor);
                if (sandStream) sandStream.setAttribute('stroke', currentColor);

                if (ratio <= 0.1 && remainingTimeMs > 0) {
                    ringEl.setAttribute('stroke', '#ef4444'); // Red
                    mainCard.classList.add('pulse-subtle');
                } else if (ratio <= 0.25 && remainingTimeMs > 0) {
                    ringEl.setAttribute('stroke', '#f59e0b'); // Amber/Orange
                    mainCard.classList.remove('pulse-subtle');
                } else {
                    ringEl.setAttribute('stroke', '#3b82f6'); // Blue
                    mainCard.classList.remove('pulse-subtle');
                }
            }
        }

        function triggerHourglassFlip() {
            const hg = document.getElementById('hourglass-container');
            if (hg) {
                hg.classList.remove('rotate-flip');
                void hg.offsetWidth; // trigger reflow
                hg.classList.add('rotate-flip');
            }
        }

        function setMode(mode) {
            pauseTimer();
            timerMode = mode;
            triggerHourglassFlip();

            // Update tab button styles
            ['countdown', 'stopwatch', 'pomodoro', 'turn'].forEach(m => {
                const tab = document.getElementById(`tab-${m}`);
                if (tab) {
                    if (m === mode) {
                        tab.className = "px-3.5 py-2 rounded-xl transition flex items-center gap-2 bg-blue-600 text-white shadow";
                    } else {
                        tab.className = "px-3.5 py-2 rounded-xl transition flex items-center gap-2 opacity-70 hover:opacity-100";
                    }
                }
            });

            // Toggle visibility of mode-specific controls
            const countdownControls = document.getElementById('countdown-controls');
            const stopwatchLaps = document.getElementById('stopwatch-lap-section');
            const turnControls = document.getElementById('turn-control-section');
            const sessionBadge = document.getElementById('session-badge');

            if (countdownControls) countdownControls.classList.toggle('hidden', mode === 'stopwatch');
            if (stopwatchLaps) stopwatchLaps.classList.toggle('hidden', mode !== 'stopwatch');
            if (turnControls) turnControls.classList.toggle('hidden', mode !== 'turn');
            
            if (sessionBadge) {
                if (mode === 'pomodoro') {
                    sessionBadge.classList.remove('hidden');
                    pomodoroPhase = 'work';
                    sessionBadge.textContent = "수업 세션 (25분)";
                    sessionBadge.className = "mb-4 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-500/30 animate-pulse";
                } else {
                    sessionBadge.classList.add('hidden');
                }
            }

            // Configure target times per mode
            if (mode === 'pomodoro') {
                targetTimeMs = POMODORO_WORK_MS;
            } else if (mode === 'stopwatch') {
                stopwatchElapsedMs = 0;
            } else if (mode === 'turn') {
                targetTimeMs = 3 * 60 * 1000;
            } else if (mode === 'countdown') {
                targetTimeMs = 5 * 60 * 1000;
            }

            resetTimer();
        }

        function stepTimer(now) {
            if (timerState !== 'running') return;

            const delta = now - lastTimestamp;
            lastTimestamp = now;

            if (timerMode === 'stopwatch') {
                stopwatchElapsedMs += delta;
            } else {
                const prevSec = Math.ceil(remainingTimeMs / 1000);
                remainingTimeMs -= delta;
                const currentSec = Math.ceil(remainingTimeMs / 1000);

                // Play 5초 전 Beep Sound
                if (document.getElementById('chk-tick-warning').checked) {
                    if (prevSec !== currentSec && currentSec <= 5 && currentSec > 0) {
                        playSound('beep');
                    }
                }

                if (remainingTimeMs <= 0) {
                    remainingTimeMs = 0;
                    updateDisplay();
                    handleTimerComplete();
                    return;
                }
            }

            updateDisplay();
            timerInterval = requestAnimationFrame(stepTimer);
        }

        function pauseTimer() {
            timerState = 'paused';
            if (timerInterval) {
                cancelAnimationFrame(timerInterval);
                timerInterval = null;
            }
            const icon = document.getElementById('btn-toggle-icon');
            const text = document.getElementById('btn-toggle-text');
            if (icon) icon.className = "fa-solid fa-play";
            if (text) text.textContent = "시작";
        }

        function resetTimer() {
            pauseTimer();
            triggerHourglassFlip();
            if (timerMode === 'stopwatch') {
                stopwatchElapsedMs = 0;
            } else if (timerMode === 'pomodoro') {
                remainingTimeMs = (pomodoroPhase === 'work') ? POMODORO_WORK_MS : POMODORO_BREAK_MS;
            } else {
                remainingTimeMs = targetTimeMs;
            }
            updateDisplay();
        }

        function handleTimerComplete() {
            pauseTimer();
            playSound(selectedAlarm);

            if (timerMode === 'pomodoro') {
                if (pomodoroPhase === 'work') {
                    pomodoroPhase = 'break';
                    const badge = document.getElementById('session-badge');
                    badge.textContent = "☕ 쉬는 시간 (5분)";
                    badge.className = "mb-4 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 animate-pulse";
                    targetTimeMs = POMODORO_BREAK_MS;
                    remainingTimeMs = targetTimeMs;
                } else {
                    pomodoroPhase = 'work';
                    const badge = document.getElementById('session-badge');
                    badge.textContent = "수업 세션 (25분)";
                    badge.className = "mb-4 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-500/30 animate-pulse";
                    targetTimeMs = POMODORO_WORK_MS;
                    remainingTimeMs = targetTimeMs;
                }
                updateDisplay();
            }
        }

        function addTime(seconds) {
            remainingTimeMs += seconds * 1000;
            if (remainingTimeMs < 0) remainingTimeMs = 0;
            if (remainingTimeMs > targetTimeMs) targetTimeMs = remainingTimeMs;
            updateDisplay();
        }

        function setPreset(minutes) {
            pauseTimer();
            triggerHourglassFlip();
            targetTimeMs = minutes * 60 * 1000;
            remainingTimeMs = targetTimeMs;
            updateDisplay();
        }

        function handleSecondaryAction() {
            if (timerMode === 'stopwatch') {
                // Record Lap
                if (stopwatchElapsedMs > 0) {
                    laps.unshift(stopwatchElapsedMs);
                    renderLaps();
                }
            } else {
                resetTimer();
            }
        }

        function renderLaps() {
            const container = document.getElementById('lap-list');
            if (laps.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-xs opacity-50">기록된 랩 타임이 없습니다.</div>`;
                return;
            }

            container.innerHTML = laps.map((lap, idx) => {
                const totalSec = Math.floor(lap / 1000);
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                const ms = Math.floor((lap % 1000) / 10);
                const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
                return `
                    <div class="flex items-center justify-between p-2 rounded-xl bg-black/20 border border-white/5">
                        <span class="font-bold opacity-70">기록 #${laps.length - idx}</span>
                        <span class="font-timer font-bold text-blue-400">${timeStr}</span>
                    </div>
                `;
            }).join('');
        }

        function clearLaps() {
            laps = [];
            renderLaps();
        }

        // Group Turn Switch
        function changeTurnGroup() {
            currentTurnGroup = document.getElementById('turn-select').value;
            resetTimer();
        }

        function nextTurnGroup() {
            let next = parseInt(document.getElementById('turn-select').value) + 1;
            if (next > 6) next = 1;
            document.getElementById('turn-select').value = next.toString();
            changeTurnGroup();
        }

        /* ==========================================================================
           Random Student / Group Picker Modal Logic
           ========================================================================== */
        let pickerType = 'number';

        function openPickerModal() {
            toggleModal('picker-modal');
        }

        function setPickerType(type) {
            pickerType = type;
            const btnNum = document.getElementById('picker-tab-num');
            const btnList = document.getElementById('picker-tab-list');
            const secNum = document.getElementById('picker-type-number');
            const secList = document.getElementById('picker-type-list');

            if (type === 'number') {
                btnNum.className = "flex-1 py-2 rounded-lg bg-blue-600 text-white";
                btnList.className = "flex-1 py-2 rounded-lg hover:bg-white/10";
                secNum.classList.remove('hidden');
                secList.classList.add('hidden');
            } else {
                btnList.className = "flex-1 py-2 rounded-lg bg-blue-600 text-white";
                btnNum.className = "flex-1 py-2 rounded-lg hover:bg-white/10";
                secList.classList.remove('hidden');
                secNum.classList.add('hidden');
            }
        }

        function spinPicker() {
            getAudioContext();
            const resultDisplay = document.getElementById('picker-result-text');
            let candidates = [];

            if (pickerType === 'number') {
                const maxNum = parseInt(document.getElementById('picker-max-num').value) || 25;
                for (let i = 1; i <= maxNum; i++) candidates.push(`${i}번 학생`);
            } else {
                const text = document.getElementById('picker-list-input').value.trim();
                candidates = text.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
                if (candidates.length === 0) candidates = ['1모둠', '2모둠', '3모둠', '4모둠'];
            }

            let spinCount = 0;
            const maxSpins = 20;
            const interval = setInterval(() => {
                spinCount++;
                const randomPick = candidates[Math.floor(Math.random() * candidates.length)];
                resultDisplay.textContent = randomPick;
                playSound('beep');

                if (spinCount >= maxSpins) {
                    clearInterval(interval);
                    playSound('school');
                }
            }, 80);
        }

        /* ==========================================================================
           Modals, Themes & Fullscreen Handling
           ========================================================================== */
        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function openCustomTimeModal() {
            const totalSec = Math.floor(remainingTimeMs / 1000);
            document.getElementById('custom-min').value = Math.floor(totalSec / 60);
            document.getElementById('custom-sec').value = totalSec % 60;
            toggleModal('custom-time-modal');
        }

        function applyCustomTime() {
            const m = parseInt(document.getElementById('custom-min').value) || 0;
            const s = parseInt(document.getElementById('custom-sec').value) || 0;
            pauseTimer();
            targetTimeMs = (m * 60 + s) * 1000;
            remainingTimeMs = targetTimeMs;
            updateDisplay();
            closeModal('custom-time-modal');
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            closeModal('theme-modal');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function saveTaskTitle() {
            const title = document.getElementById('task-title-input').value;
            localStorage.setItem('classroom_timer_title', title);
        }

        // Initialize on Load
        window.onload = function() {
            const savedTitle = localStorage.getItem('classroom_timer_title');
            if (savedTitle) {
                document.getElementById('task-title-input').value = savedTitle;
            }
            updateDisplay();
        };
    </script>
</body>
</html>
