<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 할 일</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-sans text-slate-800">
    
    <div id="app" class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden transition-all">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-white">
            <h1 class="text-3xl font-bold mb-1">나의 할 일</h1>
            <p id="currentDate" class="text-blue-100 text-sm"></p>
        </div>

        <!-- Input Form -->
        <div class="p-6 pb-2">
            <form id="todoForm" class="flex flex-col gap-3">
                <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요..." class="w-full px-4 py-3 bg-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-200">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex flex-col gap-2">
                    <input type="datetime-local" id="startInput" class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg">
                    <input type="datetime-local" id="endInput" class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700">할 일 추가</button>
            </form>
        </div>

        <!-- Filters -->
        <div class="flex px-6 pt-2 pb-4 gap-4 border-b border-slate-100">
            <button onclick="setFilter('all')" class="text-sm font-medium text-blue-600 border-b-2 border-blue-600 pb-1">전체보기</button>
            <button onclick="setFilter('active')" class="text-sm font-medium text-slate-400 pb-1">진행중</button>
            <button onclick="setFilter('completed')" class="text-sm font-medium text-slate-400 pb-1">완료됨</button>
        </div>

        <!-- Todo List -->
        <ul id="todoList" class="p-4 h-[400px] overflow-y-auto custom-scrollbar space-y-2"></ul>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let filter = 'all';

        const todoForm = document.getElementById('todoForm');
        const todoList = document.getElementById('todoList');
        const currentDateEl = document.getElementById('currentDate');

        currentDateEl.innerText = new Date().toLocaleDateString('ko-KR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function save() {
            localStorage.setItem('todos', JSON.stringify(todos));
            render();
        }

        todoForm.onsubmit = (e) => {
            e.preventDefault();
            const text = document.getElementById('todoInput').value;
            if (!text) return;
            todos.unshift({
                id: Date.now(),
                text,
                completed: false,
                start: document.getElementById('startInput').value,
                end: document.getElementById('endInput').value
            });
            todoForm.reset();
            save();
        };

        function setFilter(f) {
            filter = f;
            render();
        }

        function toggleTodo(id) {
            todos = todos.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            save();
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            save();
        }

        function render() {
            todoList.innerHTML = '';
            const filtered = todos.filter(t => filter === 'all' ? true : (filter === 'active' ? !t.completed : t.completed));
            
            filtered.forEach(todo => {
                const li = document.createElement('li');
                li.className = `p-4 rounded-2xl border ${todo.completed ? 'bg-slate-50' : 'bg-white shadow-sm'}`;
                li.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex-1 cursor-pointer" onclick="toggleTodo(${todo.id})">
                            <p class="${todo.completed ? 'line-through text-slate-400' : 'text-slate-700'} font-medium">${todo.text}</p>
                            <p class="text-xs text-blue-500 mt-1">${todo.start || todo.end ? (todo.start + ' ~ ' + todo.end) : ''}</p>
                        </div>
                        <button onclick="deleteTodo(${todo.id})" class="text-red-400 hover:text-red-600">삭제</button>
                    </div>
                `;
                todoList.appendChild(li);
            });
        }

        setInterval(render, 60000);
        render();
    </script>
</body>
</html>
