<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI System Architect & Brand Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --font-main: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            --max-width: 1100px;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-primary); font-family: var(--font-main); line-height: 1.7; -webkit-font-smoothing: antialiased; transition: background-color 0.3s ease, color 0.3s ease; }
        a { color: inherit; text-decoration: none; }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
        section { padding: 100px 0; border-bottom: 1px solid var(--border-color); }
        section:last-of-type { border-bottom: none; }
        h1, h2, h3 { font-weight: 700; letter-spacing: -0.03em; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent-color); margin-bottom: 40px; font-weight: 700; display: inline-block; padding: 8px 16px; background: rgba(59, 130, 246, 0.1); border-radius: 8px; }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-on-scroll { opacity: 0; }
        .animate-on-scroll.visible { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Navigation */
        nav { position: fixed; top: 0; left: 0; width: 100%; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 1000; border-bottom: 1px solid var(--glass-border); transition: all 0.3s ease; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .logo { font-weight: 800; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.05em; background: linear-gradient(135deg, var(--text-primary), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
        .nav-links a { font-size: 0.95rem; font-weight: 500; color: var(--text-secondary); transition: all 0.3s ease; position: relative; }
        .nav-links a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -6px; left: 0; background-color: var(--accent-color); transition: width 0.3s ease; }
        .nav-links a:hover { color: var(--text-primary); }
        .nav-links a:hover::after { width: 100%; }
        
        .admin-nav-btn { color: var(--accent-color) !important; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: rgba(59, 130, 246, 0.1); border-radius: 8px; font-size: 0.9rem; transition: all 0.3s ease; }
        .admin-nav-btn::after { display: none !important; }
        .admin-nav-btn:hover { background: var(--accent-color); color: #fff !important; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        /* Hero */
        .hero { min-height: 90vh; display: flex; align-items: center; padding-top: 70px; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -20%; right: -10%; width: 60vw; height: 60vw; max-width: 800px; max-height: 800px; background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; z-index: -1; pointer-events: none; }
        .hero-tag { display: inline-block; background: rgba(59, 130, 246, 0.1); color: var(--accent-color); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 24px; border: 1px solid rgba(59, 130, 246, 0.2); }
        .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); line-height: 1.2; margin-bottom: 24px; word-break: keep-all; color: var(--text-primary); letter-spacing: -0.04em; }
        .hero p { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 40px; max-width: 700px; word-break: keep-all; line-height: 1.8; }
        .btn-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 1rem; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; border: none; }
        .btn-primary { background-color: var(--accent-color); color: #ffffff; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); }
        .btn-primary:hover { background-color: var(--accent-hover); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }
        .btn-secondary { background-color: transparent; color: var(--text-primary); border: 2px solid var(--border-color); }
        .btn-secondary:hover { border-color: var(--text-primary); transform: translateY(-3px); background: rgba(15, 23, 42, 0.02); }

        /* Grids */
        .about-text { font-size: 1.25rem; line-height: 1.8; margin-bottom: 50px; word-break: keep-all; max-width: 800px; color: var(--text-secondary); }
        .about-text strong { color: var(--text-primary); font-weight: 700; background: linear-gradient(120deg, rgba(59, 130, 246, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%); background-repeat: no-repeat; background-size: 100% 30%; background-position: 0 88%; }
        .about-features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .about-feature-item { padding: 32px 24px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .about-feature-item:hover { transform: translateY(-5px); border-color: var(--accent-color); box-shadow: 0 10px 25px rgba(59,130,246,0.1); }
        .about-feature-item h4 { font-size: 1.15rem; margin-bottom: 12px; color: var(--text-primary); }
        .about-feature-item p { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; }

        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
        .service-card { background: var(--card-bg); padding: 40px 32px; border-radius: 20px; border: 1px solid var(--border-color); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 4px 6px rgba(0,0,0,0.02); position: relative; overflow: hidden; }
        .service-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-color); transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease; }
        .service-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.06); border-color: transparent; }
        .service-card:hover::before { transform: scaleX(1); }
        .service-card .icon { font-size: 2.8rem; margin-bottom: 24px; display: inline-block; padding: 16px; background: rgba(59, 130, 246, 0.08); border-radius: 16px; transition: transform 0.3s ease; }
        .service-card:hover .icon { transform: scale(1.1); }
        .service-card h3 { font-size: 1.3rem; margin-bottom: 16px; color: var(--text-primary); }
        .service-card p { color: var(--text-secondary); font-size: 1rem; line-height: 1.6; }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }
        .project-card { border: 1px solid var(--border-color); border-radius: 20px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; background: var(--card-bg); transition: all 0.4s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .project-card:hover { transform: translateY(-10px); box-shadow: 0 24px 48px rgba(0,0,0,0.08); border-color: rgba(59,130,246,0.3); }
        .project-img-wrapper { width: 100%; height: 220px; border-radius: 12px; overflow: hidden; margin-bottom: 24px; background: var(--border-color); }
        .project-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .project-card:hover .project-img { transform: scale(1.05); }
        .project-category { font-size: 0.8rem; color: var(--accent-color); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.05em; }
        .project-card h3 { font-size: 1.5rem; margin-bottom: 16px; color: var(--text-primary); }
        .project-card p { color: var(--text-secondary); margin-bottom: 24px; font-size: 1rem; line-height: 1.6; }
        .project-link-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 0.95rem; color: var(--accent-color); font-weight: 600; margin-top: auto; transition: gap 0.3s ease; }
        .project-card:hover .project-link-btn { gap: 12px; }
        .project-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
        .tag { font-size: 0.8rem; background: rgba(59, 130, 246, 0.1); padding: 6px 12px; border-radius: 20px; color: var(--accent-color); font-weight: 600; }

        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 30px; }
        .tech-group { background: var(--card-bg); padding: 32px; border-radius: 20px; border: 1px solid var(--border-color); transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .tech-group:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); border-color: rgba(59,130,246,0.3); }
        .tech-group h3 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 2px solid rgba(59, 130, 246, 0.2); padding-bottom: 12px; display: inline-block; color: var(--text-primary); }
        .tech-list { list-style: none; }
        .tech-list li { font-size: 1rem; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .tech-list li::before { content: '•'; color: var(--accent-color); font-size: 1.5rem; }

        .contact { text-align: center; padding: 120px 0; background: linear-gradient(180deg, var(--bg-color) 0%, rgba(59,130,246,0.05) 100%); }
        .contact h2 { font-size: 2.5rem; margin-bottom: 24px; color: var(--text-primary); }
        .contact p { font-size: 1.15rem; color: var(--text-secondary); margin-bottom: 40px; max-width: 600px; margin-inline: auto; line-height: 1.8; }
        .social-links { display: flex; justify-content: center; gap: 24px; margin-top: 48px; }
        .social-links a { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; color: var(--text-primary); font-size: 1.5rem; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .social-links a:hover { background: var(--accent-color); color: #fff; border-color: var(--accent-color); transform: translateY(-5px) rotate(8deg); box-shadow: 0 10px 20px rgba(59,130,246,0.3); }
        footer { padding: 40px 0; text-align: center; font-size: 0.95rem; color: var(--text-secondary); background: var(--bg-color); }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            section { padding: 80px 0; }
            .hero { padding-top: 100px; min-height: auto; padding-bottom: 80px; }
            .hero h1 { font-size: 2.2rem; }
            .contact { padding: 80px 0; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-container">
            <a href="#" class="logo" id="navLogo">PORTFOLIO</a>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#what-i-do">What I Do</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#tech">Tech Stack</a></li>
                <li><a href="#contact">Contact</a></li>
                <li>
                    <!-- Netlify _headers에서 서버 접근 권한을 제어하므로 순수한 링크로 관리 -->
                    <a href="admin.html" class="admin-nav-btn">
                        <i class="ph ph-lock-key"></i> Admin
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <span class="hero-tag" id="heroTag"></span>
            <h1 id="heroTitle"></h1>
            <p id="heroSubtitle"></p>
            <div class="btn-group">
                <a href="timer.html" class="btn btn-primary">나의 첫 작품 보기</a>
                <a href="#contact" class="btn btn-secondary">문의하기</a>
            </div>
        </div>
    </header>

    <section id="about">
        <div class="container">
            <div class="section-title">About</div>
            <p class="about-text" id="aboutText"></p>
            <div class="about-features" id="aboutFeatures"></div>
        </div>
    </section>

    <section id="what-i-do">
        <div class="container">
            <div class="section-title">What I Do</div>
            <div class="services-grid" id="servicesGrid"></div>
        </div>
    </section>

    <section id="projects">
        <div class="container">
            <div class="section-title">Featured Projects</div>
            <div class="projects-grid" id="projectsGrid"></div>
        </div>
    </section>

    <section id="tech">
        <div class="container">
            <div class="section-title">Technology & Tools</div>
            <div class="tech-grid" id="techGrid"></div>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
            <h2 id="contactTitle"></h2>
            <p id="contactDesc"></p>
            <a href="#" id="contactEmailBtn" class="btn btn-primary">이메일로 문의하기</a>
            <div class="social-links" id="socialLinks"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p id="footerCopyright"></p>
        </div>
    </footer>

    <script>
        function renderUI(d) {
            document.title = `${d.name} | AI System Architect & Brand Hub`;
            document.getElementById('navLogo').innerText = d.name;
            document.getElementById('heroTag').innerText = d.hero.tag;
            document.getElementById('heroTitle').innerHTML = d.hero.title.replace(/\n/g, '<br>');
            document.getElementById('heroSubtitle').innerText = d.hero.subtitle;

            document.getElementById('aboutText').innerHTML = d.about.text.replace(/\n/g, '<br>');
            document.getElementById('aboutFeatures').innerHTML = d.about.features.map(f => `
                <div class="about-feature-item">
                    <h4>${f.title}</h4>
                    <p>${f.desc}</p>
                </div>
            `).join('');

            document.getElementById('servicesGrid').innerHTML = d.services.map(s => `
                <div class="service-card">
                    <div class="icon">${s.icon}</div>
                    <h3>${s.title}</h3>
                    <p>${s.desc}</p>
                </div>
            `).join('');

            document.getElementById('projectsGrid').innerHTML = d.projects.map(p => {
                const imgHtml = p.image ? `
                    <div class="project-img-wrapper">
                        <img src="${p.image}" alt="${p.title}" class="project-img" onerror="this.style.display='none'">
                    </div>` : '';
                
                const linkHtml = p.link ? `
                    <a href="${p.link}" target="_blank" class="project-link-btn">
                        <i class="ph ph-link-simple"></i> ${p.linkText || '자세히 보기'}
                    </a>` : '';

                return `
                <div class="project-card">
                    <div>
                        ${imgHtml}
                        <div class="project-category">${p.category}</div>
                        <h3>${p.title}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <div>
                        ${linkHtml}
                        <div class="project-tags">
                            ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('techGrid').innerHTML = d.techGroups.map(g => `
                <div class="tech-group">
                    <h3>${g.title}</h3>
                    <ul class="tech-list">
                        ${g.items.map(i => `<li>${i}</li>`).join('')}
                    </ul>
                </div>
            `).join('');

            document.getElementById('contactTitle').innerText = d.contact.title;
            document.getElementById('contactDesc').innerText = d.contact.desc;
            document.getElementById('contactEmailBtn').href = `mailto:${d.contact.email}`;

            let socialHtml = '';
            if (d.contact.social.github) socialHtml += `<a href="${d.contact.social.github}" target="_blank" title="GitHub"><i class="ph ph-github-logo"></i></a>`;
            if (d.contact.social.linkedin) socialHtml += `<a href="${d.contact.social.linkedin}" target="_blank" title="LinkedIn"><i class="ph ph-linkedin-logo"></i></a>`;
            if (d.contact.social.youtube) socialHtml += `<a href="${d.contact.social.youtube}" target="_blank" title="YouTube"><i class="ph ph-youtube-logo"></i></a>`;
            document.getElementById('socialLinks').innerHTML = socialHtml;

            document.getElementById('footerCopyright').innerHTML = `&copy; ${new Date().getFullYear()} ${d.name}. All rights reserved.`;
        }

        async function loadPortfolioData() {
            try {
                const res = await fetch('data.json?v=' + new Date().getTime());
                if(!res.ok) throw new Error("File not found");
                const data = await res.json();
                renderUI(data);
                setTimeout(initScrollAnimations, 100);
            } catch (e) {
                console.log("data.json 로드 실패:", e);
            }
        }

        function initScrollAnimations() {
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        obs.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            const elements = document.querySelectorAll('.hero-tag, .hero h1, .hero p, .btn-group, .section-title, .about-text, .about-feature-item, .service-card, .project-card, .tech-group, .contact h2, .contact p, .contact .btn, .social-links a');
            elements.forEach((el, index) => {
                el.classList.add('animate-on-scroll');
                el.style.animationDelay = `${(index % 6) * 0.1}s`;
                observer.observe(el);
            });
        }

        window.addEventListener('DOMContentLoaded', loadPortfolioData);
    </script>
</body>
</html>
