<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI System Architect & Brand Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #111111;
            --text-secondary: #666666;
            --accent-color: #0052ff;
            --border-color: #eaeaea;
            --card-bg: #fafafa;
            --font-main: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            --max-width: 1000px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-color); color: var(--text-primary); font-family: var(--font-main); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        a { color: inherit; text-decoration: none; }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
        section { padding: 60px 0; border-bottom: 1px solid var(--border-color); }
        section:last-of-type { border-bottom: none; }
        h1, h2, h3 { font-weight: 700; letter-spacing: -0.02em; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin-bottom: 20px; font-weight: 600; }

        /* Navigation */
        nav { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 56px; }
        .logo { font-weight: 700; font-size: 1.05rem; text-transform: uppercase; }
        .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
        .nav-links a { font-size: 0.875rem; color: var(--text-secondary); transition: color 0.2s ease; }
        .nav-links a:hover { color: var(--text-primary); }
        
        .admin-nav-btn {
            color: var(--accent-color) !important;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #f0f4ff;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: background 0.2s ease;
        }
        .admin-nav-btn:hover { background: #e0eaff; }

        /* Hero */
        .hero { padding-top: 120px; padding-bottom: 60px; }
        .hero-tag { display: inline-block; background: #f0f4ff; color: var(--accent-color); padding: 5px 12px; border-radius: 20px; font-size: 0.825rem; font-weight: 600; margin-bottom: 16px; }
        .hero h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); line-height: 1.25; margin-bottom: 16px; word-break: keep-all; }
        .hero p { font-size: 1.15rem; color: var(--text-secondary); margin-bottom: 28px; max-width: 680px; word-break: keep-all; }
        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 22px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: all 0.2s ease; cursor: pointer; border: none; }
        .btn-primary { background-color: var(--text-primary); color: #ffffff; }
        .btn-primary:hover { background-color: #333333; }
        .btn-secondary { background-color: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: #f0f0f0; }

        /* Grids */
        .about-text { font-size: 1.2rem; line-height: 1.6; margin-bottom: 28px; word-break: keep-all; }
        .about-features { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .about-feature-item { border-left: 2px solid var(--accent-color); padding-left: 14px; }
        .about-feature-item h4 { font-size: 0.95rem; margin-bottom: 2px; }
        .about-feature-item p { font-size: 0.85rem; color: var(--text-secondary); }

        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .service-card { background: var(--card-bg); padding: 24px 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .service-card .icon { font-size: 1.6rem; margin-bottom: 12px; }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .project-card { border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; background: #ffffff; transition: transform 0.2s ease; }
        .project-card:hover { transform: translateY(-3px); }
        .project-img-wrapper { width: 100%; height: 160px; border-radius: 8px; overflow: hidden; margin-bottom: 16px; background: #f1f5f9; }
        .project-img { width: 100%; height: 100%; object-fit: cover; }
        .project-category { font-size: 0.75rem; color: var(--accent-color); font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
        .project-link-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--accent-color); font-weight: 600; margin-top: 12px; }
        .project-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
        .tag { font-size: 0.725rem; background: var(--card-bg); padding: 3px 8px; border-radius: 4px; color: var(--text-secondary); border: 1px solid var(--border-color); }

        .tech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
        .tech-group h3 { font-size: 0.95rem; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .tech-list { list-style: none; }
        .tech-list li { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 6px; }

        .contact { text-align: center; padding: 70px 0; }
        .social-links { display: flex; justify-content: center; gap: 20px; margin-top: 24px; }
        footer { padding: 28px 0; text-align: center; font-size: 0.825rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            section { padding: 48px 0; }
            .hero { padding-top: 100px; padding-bottom: 48px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-container">
            <a href="#" class="logo" id="navLogo">PORTFOLIO</a>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#what-i-do">What I Do</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#tech">Tech Stack</a></li>
                <li><a href="#contact">Contact</a></li>
                <li>
                    <!-- Netlify _headers에서 서버 접근 권한을 제어하므로 순수한 링크로 관리 -->
                    <a href="admin.html" class="admin-nav-btn">
                        <i class="ph ph-lock-key"></i> Admin
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <span class="hero-tag" id="heroTag"></span>
            <h1 id="heroTitle"></h1>
            <p id="heroSubtitle"></p>
            <div class="btn-group">
                <a href="timer.html" class="btn btn-primary">나의 첫 작품 보기</a>
                <a href="#contact" class="btn btn-secondary">문의하기</a>
            </div>
        </div>
    </header>

    <section id="about">
        <div class="container">
            <div class="section-title">About</div>
            <p class="about-text" id="aboutText"></p>
            <div class="about-features" id="aboutFeatures"></div>
        </div>
    </section>

    <section id="what-i-do">
        <div class="container">
            <div class="section-title">What I Do</div>
            <div class="services-grid" id="servicesGrid"></div>
        </div>
    </section>

    <section id="projects">
        <div class="container">
            <div class="section-title">Featured Projects</div>
            <div class="projects-grid" id="projectsGrid"></div>
        </div>
    </section>

    <section id="tech">
        <div class="container">
            <div class="section-title">Technology & Tools</div>
            <div class="tech-grid" id="techGrid"></div>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
            <h2 id="contactTitle"></h2>
            <p id="contactDesc"></p>
            <a href="#" id="contactEmailBtn" class="btn btn-primary">이메일로 문의하기</a>
            <div class="social-links" id="socialLinks"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p id="footerCopyright"></p>
        </div>
    </footer>

    <script>
        function renderUI(d) {
            document.title = `${d.name} | AI System Architect & Brand Hub`;
            document.getElementById('navLogo').innerText = d.name;
            document.getElementById('heroTag').innerText = d.hero.tag;
            document.getElementById('heroTitle').innerHTML = d.hero.title.replace(/\n/g, '<br>');
            document.getElementById('heroSubtitle').innerText = d.hero.subtitle;

            document.getElementById('aboutText').innerHTML = d.about.text.replace(/\n/g, '<br>');
            document.getElementById('aboutFeatures').innerHTML = d.about.features.map(f => `
                <div class="about-feature-item">
                    <h4>${f.title}</h4>
                    <p>${f.desc}</p>
                </div>
            `).join('');

            document.getElementById('servicesGrid').innerHTML = d.services.map(s => `
                <div class="service-card">
                    <div class="icon">${s.icon}</div>
                    <h3>${s.title}</h3>
                    <p>${s.desc}</p>
                </div>
            `).join('');

            document.getElementById('projectsGrid').innerHTML = d.projects.map(p => {
                const imgHtml = p.image ? `
                    <div class="project-img-wrapper">
                        <img src="${p.image}" alt="${p.title}" class="project-img" onerror="this.style.display='none'">
                    </div>` : '';
                
                const linkHtml = p.link ? `
                    <a href="${p.link}" target="_blank" class="project-link-btn">
                        <i class="ph ph-link-simple"></i> ${p.linkText || '자세히 보기'}
                    </a>` : '';

                return `
                <div class="project-card">
                    <div>
                        ${imgHtml}
                        <div class="project-category">${p.category}</div>
                        <h3>${p.title}</h3>
                        <p>${p.desc}</p>
                    </div>
                    <div>
                        ${linkHtml}
                        <div class="project-tags">
                            ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('techGrid').innerHTML = d.techGroups.map(g => `
                <div class="tech-group">
                    <h3>${g.title}</h3>
                    <ul class="tech-list">
                        ${g.items.map(i => `<li>${i}</li>`).join('')}
                    </ul>
                </div>
            `).join('');

            document.getElementById('contactTitle').innerText = d.contact.title;
            document.getElementById('contactDesc').innerText = d.contact.desc;
            document.getElementById('contactEmailBtn').href = `mailto:${d.contact.email}`;

            let socialHtml = '';
            if (d.contact.social.github) socialHtml += `<a href="${d.contact.social.github}" target="_blank">GitHub</a>`;
            if (d.contact.social.linkedin) socialHtml += `<a href="${d.contact.social.linkedin}" target="_blank">LinkedIn</a>`;
            if (d.contact.social.youtube) socialHtml += `<a href="${d.contact.social.youtube}" target="_blank">YouTube</a>`;
            document.getElementById('socialLinks').innerHTML = socialHtml;

            document.getElementById('footerCopyright').innerHTML = `&copy; ${new Date().getFullYear()} ${d.name}. All rights reserved.`;
        }

        async function loadPortfolioData() {
            try {
                const res = await fetch('data.json?v=' + new Date().getTime());
                if(!res.ok) throw new Error("File not found");
                const data = await res.json();
                renderUI(data);
            } catch (e) {
                console.log("data.json 로드 실패:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', loadPortfolioData);
    </script>
</body>
</html>
